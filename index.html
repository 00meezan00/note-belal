<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DDE5E0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="نوتة بلال">
<title>نوتة بلال</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Readex+Pro:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script>
  try { const t = localStorage.getItem('nota.theme'); if (t && t !== 'system') document.documentElement.dataset.theme = t; const n = localStorage.getItem('nota.night'); if (n && n !== 'workshop') document.documentElement.dataset.night = n; } catch (e) {}
</script>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<div id="syncpill" role="status" hidden></div>
<div id="app">
  <header id="top"></header>
  <main id="main"><div class="boot">بتحمّل النوتة…</div></main>
  <nav id="dock" hidden></nav>
</div>
<div id="sheet-root" hidden><div class="sheet-back" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
